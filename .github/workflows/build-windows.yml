name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter psutil

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "UniversalMobileMaster" universal_mobile_master.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Universal-Mobile-Master-Windows
        path: dist/UniversalMobileMaster.exe
