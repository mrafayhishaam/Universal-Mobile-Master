name: Build Windows EXE & Create Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyinstaller customtkinter psutil

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "UniversalMobileMaster" universal_mobile_master.py

      - name: Create Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UniversalMobileMaster.exe
          tag_name: v1.0-auto-build
          name: "Latest Auto-Build (Windows)"
          body: "Automatically generated Windows EXE. Download and run directly."
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
